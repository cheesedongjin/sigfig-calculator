<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SigFig — 유효숫자 학습 계산기</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --panel: #1e2230;
    --border: #2a2f3e;
    --accent: #4af0c8;
    --accent2: #f0c84a;
    --accent3: #f05a7e;
    --text: #e8eaf2;
    --muted: #6b7299;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Noto Sans KR', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ─── HEADER ─── */
  header {
    width: 100%;
    max-width: 720px;
    padding: 28px 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-family: var(--mono);
    font-size: 1.3rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -0.03em;
  }
  .logo span { color: var(--muted); font-weight: 400; }

  /* MODE TOGGLE */
  .mode-toggle {
    display: flex;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    font-size: 0.75rem;
  }
  .mode-btn {
    padding: 7px 14px;
    cursor: pointer;
    color: var(--muted);
    font-family: var(--sans);
    font-weight: 500;
    border: none;
    background: transparent;
    transition: all .2s;
    white-space: nowrap;
  }
  .mode-btn.active {
    background: var(--accent);
    color: #0d0f14;
  }

  /* ─── MAIN ─── */
  main {
    width: 100%;
    max-width: 720px;
    padding: 20px;
    flex: 1;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 14px;
  }

  .card-title {
    font-size: 0.7rem;
    font-family: var(--mono);
    color: var(--muted);
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  /* ─── CALC INPUT (B MODE) ─── */
  .input-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    align-items: end;
    margin-bottom: 12px;
  }

  .input-group label {
    display: block;
    font-size: 0.7rem;
    color: var(--muted);
    margin-bottom: 5px;
    font-family: var(--mono);
  }

  input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px 14px;
    font-family: var(--mono);
    font-size: 1.05rem;
    color: var(--text);
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }
  input.warn { border-color: var(--accent2); }
  input.err  { border-color: var(--accent3); }

  .op-select {
    display: flex;
    flex-direction: column;
    gap: 4px;
    align-items: center;
  }
  .op-select label {
    font-size: 0.7rem;
    color: var(--muted);
    font-family: var(--mono);
  }
  .op-btn-group {
    display: flex;
    gap: 4px;
  }
  .op-btn {
    width: 42px;
    height: 42px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    font-family: var(--mono);
    transition: all .15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .op-btn:hover { border-color: var(--accent); color: var(--accent); }
  .op-btn.selected {
    background: var(--accent);
    color: #0d0f14;
    border-color: var(--accent);
    font-weight: 600;
  }

  /* UNIT INPUT */
  .unit-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .unit-input {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-family: var(--mono);
    font-size: 0.85rem;
    color: var(--muted);
    width: 100%;
    outline: none;
  }
  .unit-input:focus { border-color: var(--muted); }
  .unit-spacer { display: flex; align-items: center; justify-content: center; }

  /* CALC BUTTON */
  .calc-btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: #0d0f14;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    font-family: var(--sans);
    cursor: pointer;
    letter-spacing: .03em;
    transition: all .15s;
    margin-top: 4px;
  }
  .calc-btn:hover { background: #62f8d5; }
  .calc-btn:active { transform: scale(.98); }

  /* ADVANCED MODE */
  .adv-input-wrap { position: relative; }
  .adv-input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 1.05rem;
    color: var(--text);
    outline: none;
    transition: border-color .2s;
    margin-bottom: 10px;
  }
  .adv-input:focus { border-color: var(--accent); }
  .adv-hint {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: var(--mono);
    margin-bottom: 12px;
  }

  /* ─── WARNINGS ─── */
  .warning-box {
    background: rgba(240,200,74,.07);
    border: 1px solid rgba(240,200,74,.3);
    border-radius: 10px;
    padding: 13px 16px;
    margin-bottom: 14px;
    display: none;
  }
  .warning-box.show { display: block; }
  .warning-title {
    font-size: 0.72rem;
    font-family: var(--mono);
    color: var(--accent2);
    margin-bottom: 8px;
    letter-spacing: .08em;
  }
  .warning-item {
    font-size: 0.8rem;
    color: #c8b86a;
    margin-bottom: 4px;
    line-height: 1.5;
  }
  .warning-suggest {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .suggest-chip {
    background: var(--panel);
    border: 1px solid rgba(240,200,74,.3);
    border-radius: 6px;
    padding: 4px 10px;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--accent2);
    cursor: pointer;
    transition: all .15s;
  }
  .suggest-chip:hover { background: rgba(240,200,74,.15); }

  /* ─── RESULT ─── */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 14px;
    display: none;
  }
  .result-card.show { display: block; }

  .result-main {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .result-label {
    font-size: 0.7rem;
    font-family: var(--mono);
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .result-value {
    font-family: var(--mono);
    font-size: 2.4rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: -.02em;
    line-height: 1;
  }
  .result-unit {
    font-family: var(--mono);
    font-size: 1.1rem;
    color: var(--muted);
  }
  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(74,240,200,.1);
    border: 1px solid rgba(74,240,200,.25);
    border-radius: 6px;
    padding: 4px 10px;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--accent);
    margin-left: auto;
    white-space: nowrap;
  }
  .result-badge.add-sub {
    background: rgba(240,200,74,.1);
    border-color: rgba(240,200,74,.25);
    color: var(--accent2);
  }

  /* STEP TABLE */
  .step-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }
  .step-table tr { border-bottom: 1px solid var(--border); }
  .step-table tr:last-child { border-bottom: none; }
  .step-table td {
    padding: 9px 4px;
    vertical-align: middle;
  }
  .step-table td:first-child {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: .06em;
    width: 130px;
    white-space: nowrap;
  }
  .step-table td:last-child {
    font-family: var(--mono);
    font-size: 0.88rem;
    color: var(--text);
  }

  .highlight-green { color: var(--accent); font-weight: 600; }
  .highlight-yellow { color: var(--accent2); font-weight: 600; }
  .highlight-red { color: var(--accent3); font-weight: 600; }

  /* SCI NOTATION */
  .sci-toggle {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .sci-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
  }
  .sci-chip:hover { border-color: var(--accent); color: var(--accent); }
  .sci-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(74,240,200,.08); }

  /* COPY BUTTON */
  .copy-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .copy-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 18px;
    font-family: var(--sans);
    font-size: 0.8rem;
    color: var(--text);
    cursor: pointer;
    transition: all .15s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .reset-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 18px;
    font-family: var(--sans);
    font-size: 0.8rem;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    margin-left: auto;
  }
  .reset-btn:hover { border-color: var(--accent3); color: var(--accent3); }

  /* ─── SIGFIG ANALYZER ─── */
  .analyzer-row {
    display: flex;
    gap: 10px;
  }
  .analyzer-row input {
    flex: 1;
  }
  .analyze-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 18px;
    color: var(--accent);
    font-family: var(--mono);
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all .15s;
  }
  .analyze-btn:hover { background: rgba(74,240,200,.1); }

  .analyzer-result {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 0.85rem;
    display: none;
  }
  .analyzer-result.show { display: block; }

  .sig-display {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .sig-digit {
    display: inline-block;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    line-height: 32px;
    text-align: center;
    font-size: 1rem;
    font-weight: 600;
  }
  .sig-digit.sig { background: rgba(74,240,200,.18); color: var(--accent); border: 1px solid rgba(74,240,200,.3); }
  .sig-digit.non-sig { background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
  .sig-digit.dot { background: transparent; color: var(--muted); border: none; width: 14px; }

  /* ─── HISTORY ─── */
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 260px;
    overflow-y: auto;
  }
  .history-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-expr {
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--muted);
    flex: 1;
  }
  .history-result {
    font-family: var(--mono);
    font-size: 0.95rem;
    color: var(--accent);
    font-weight: 600;
  }
  .history-empty {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    padding: 20px;
    font-family: var(--mono);
  }

  .clear-history-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.72rem;
    font-family: var(--mono);
    cursor: pointer;
    margin-left: auto;
    padding: 2px 6px;
    transition: color .15s;
  }
  .clear-history-btn:hover { color: var(--accent3); }

  /* ─── SECTION DIVIDER ─── */
  .section-header {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    gap: 10px;
  }
  .section-header .card-title { margin-bottom: 0; }

  /* ─── ERROR MSG ─── */
  .error-msg {
    background: rgba(240,90,126,.08);
    border: 1px solid rgba(240,90,126,.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--accent3);
    display: none;
    margin-top: 10px;
  }
  .error-msg.show { display: block; }

  /* ─── EXAM MODE OVERLAY ─── */
  body.exam-mode .step-table tr:not(.exam-show) td:last-child { opacity: .3; }
  body.exam-mode .warning-box { display: none !important; }

  /* ─── MOBILE ─── */
  @media (max-width: 520px) {
    .input-row { grid-template-columns: 1fr; }
    .op-select { flex-direction: row; align-items: center; }
    .result-value { font-size: 1.9rem; }
    .op-btn-group { flex-wrap: wrap; }
    .unit-row { grid-template-columns: 1fr auto 1fr; }
  }

  /* scroll */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── EXAM QUICK MODE ── */
  .exam-quick {
    display: none;
  }
  body.exam-mode .exam-quick { display: block; }
  body.exam-mode .practice-only { display: none; }

  /* STEP DETAIL COLLAPSE */
  .step-toggle {
    font-size: 0.72rem;
    font-family: var(--mono);
    color: var(--muted);
    cursor: pointer;
    text-decoration: underline;
    margin-top: 10px;
    display: inline-block;
  }
  .step-toggle:hover { color: var(--accent); }

  /* ROUNDING HIGHLIGHT */
  .round-highlight {
    position: relative;
    display: inline-block;
  }
  .round-highlight::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--accent3);
    border-radius: 1px;
  }

  /* intermediate rounding option */
  .option-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.78rem;
    color: var(--muted);
    font-family: var(--mono);
    margin-top: 10px;
  }
  .toggle-switch {
    width: 34px;
    height: 18px;
    background: var(--border);
    border-radius: 9px;
    position: relative;
    cursor: pointer;
    transition: background .2s;
    flex-shrink: 0;
  }
  .toggle-switch.on { background: var(--accent); }
  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    background: #fff;
    border-radius: 50%;
    top: 2px;
    left: 2px;
    transition: left .2s;
  }
  .toggle-switch.on::after { left: 18px; }
</style>
</head>
<body>

<header>
  <div class="logo">SigFig<span>.calc</span></div>
  <div class="mode-toggle">
    <button class="mode-btn active" id="btn-practice" onclick="setMode('practice')">📚 연습</button>
    <button class="mode-btn" id="btn-exam" onclick="setMode('exam')">⚡ 시험</button>
  </div>
</header>

<main>

  <!-- ── EXAM MODE BANNER ── -->
  <div id="exam-banner" style="display: none; background: rgba(240, 90, 126, 0.1); border: 1px solid rgba(240, 90, 126, 0.3); border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; text-align: center; color: var(--accent3); font-family: var(--sans); font-size: 0.85rem; font-weight: 500;">
    ⚡ <strong>시험 모드 활성화됨:</strong> 과정과 경고가 숨겨지며 최종 결과만 표시됩니다.
  </div>

  <!-- ── INPUT CARD ── -->
  <div class="card" id="input-card">
    <div class="section-header">
      <div class="card-title">계산 입력</div>
      <div class="mode-toggle" style="font-size:.68rem; margin-left: auto;">
        <button class="mode-btn active" id="btn-basic" onclick="setInputMode('basic')">기본</button>
        <button class="mode-btn" id="btn-adv" onclick="setInputMode('adv')">고급 식</button>
      </div>
    </div>

    <!-- BASIC MODE (B) -->
    <div id="basic-input">
      <div class="input-row">
        <div class="input-group">
          <label>값 1</label>
          <input type="text" id="v1" placeholder="예) 2.40" oninput="onValueInput(1)" autocomplete="off">
          <div id="v1-viz" style="margin-top: 4px; display: none;"></div>
        </div>
        <div class="op-select">
          <label>연산</label>
          <div class="op-btn-group">
            <button class="op-btn selected" id="op-mul" onclick="selectOp('×')">×</button>
            <button class="op-btn" id="op-div" onclick="selectOp('÷')">÷</button>
            <button class="op-btn" id="op-add" onclick="selectOp('+')">+</button>
            <button class="op-btn" id="op-sub" onclick="selectOp('−')">−</button>
          </div>
          <div id="rule-desc" style="margin-top: 8px; font-size: 0.75rem; color: var(--accent); font-family: var(--sans); font-weight: 500; text-align: center;">곱셈/나눗셈 → 유효숫자 기준</div>
        </div>
        <div class="input-group">
          <label>값 2</label>
          <input type="text" id="v2" placeholder="예) 3.1" oninput="onValueInput(2)" autocomplete="off">
          <div id="v2-viz" style="margin-top: 4px; display: none;"></div>
        </div>
      </div>
      <div class="unit-row practice-only">
        <input class="unit-input" id="u1" placeholder="단위 (선택) 예) g" autocomplete="off">
        <div class="unit-spacer" style="color:var(--muted); font-family:var(--mono); font-size:1rem;">→</div>
        <input class="unit-input" id="u2" placeholder="단위 (선택) 예) mL" autocomplete="off">
      </div>
      <div class="option-row practice-only">
        <div class="toggle-switch on" id="no-intermediate-toggle" onclick="toggleOption('noIntermediate')"></div>
        <span>중간 반올림 없이 최종 결과만 적용 (권장)</span>
      </div>
    </div>

    <!-- ADVANCED MODE (A) -->
    <div id="adv-input" style="display:none;">
      <div class="adv-hint">수식 입력 예: (2.40 * 3.1) + 1.03 &nbsp;|&nbsp; 12.11 + 0.3 &nbsp;|&nbsp; 6.022e23 / 3.5</div>
      <input class="adv-input" id="adv-expr" placeholder="계산식 입력..." oninput="onAdvInput()" autocomplete="off">
      <div class="option-row practice-only">
        <div class="toggle-switch on" id="no-intermediate-toggle-adv" onclick="toggleOption('noIntermediate')"></div>
        <span>중간 반올림 없이 최종 결과만 적용 (권장)</span>
      </div>
    </div>

    <!-- WARNINGS -->
    <div class="warning-box" id="warn-box">
      <div class="warning-title">⚠ 유효숫자 해석 주의</div>
      <div id="warn-content"></div>
    </div>

    <div class="error-msg" id="err-msg"></div>

    <button class="calc-btn" onclick="calculate()">계산하기</button>
  </div>

  <!-- ── RESULT CARD ── -->
  <div class="result-card" id="result-card">
    <div class="section-header">
      <div class="card-title">계산 결과</div>
      <div id="rule-badge" class="result-badge">유효숫자 기준</div>
    </div>

    <div class="result-main">
      <div>
        <div class="result-label" style="margin-bottom:5px;">보고값</div>
        <div>
          <span class="result-value" id="res-final"></span>
          <span class="result-unit" id="res-unit-display"></span>
        </div>
      </div>
    </div>

    <!-- STEP TABLE (practice only) -->

<script>
// ─────────────────────────────────────────────
//  ADVANCED PARSER & EVALUATOR
// ─────────────────────────────────────────────

// Tokenizer
function tokenize(expr) {
  const tokens = [];
  let i = 0;

  // Supported functions
  const funcs = ['log', 'ln', 'exp', 'sqrt', 'sin', 'cos', 'tan'];

  while (i < expr.length) {
    const char = expr[i];

    // Skip whitespace
    if (/\s/.test(char)) {
      i++;
      continue;
    }

    // Operators and parentheses
    if (/[\+\-\*\/\^\(\)×÷]/.test(char)) {
      tokens.push({ type: 'operator', value: char === '×' ? '*' : char === '÷' ? '/' : char });
      i++;
      continue;
    }

    // Numbers (including decimals and scientific notation like 1.2e-3)
    if (/[\d\.]/.test(char)) {
      let numStr = '';
      while (i < expr.length && /[\d\.]/.test(expr[i])) {
        numStr += expr[i];
        i++;
      }
      // Check for scientific notation (e or E followed by optional + or - and digits)
      if (i < expr.length && /[eE]/.test(expr[i])) {
        numStr += expr[i];
        i++;
        if (i < expr.length && /[\+\-]/.test(expr[i])) {
          numStr += expr[i];
          i++;
        }
        while (i < expr.length && /\d/.test(expr[i])) {
          numStr += expr[i];
          i++;
        }
      }
      tokens.push({ type: 'number', value: numStr });
      continue;
    }

    // Functions
    if (/[a-zA-Z]/.test(char)) {
      let funcStr = '';
      while (i < expr.length && /[a-zA-Z]/.test(expr[i])) {
        funcStr += expr[i].toLowerCase();
        i++;
      }
      if (funcs.includes(funcStr)) {
        tokens.push({ type: 'function', value: funcStr });
      } else {
        throw new Error('Unknown function or variable: ' + funcStr);
      }
      continue;
    }

    throw new Error('Invalid character in expression: ' + char);
  }
  return tokens;
}

// Parser (Recursive Descent)
function parse(tokens) {
  let pos = 0;

  function peek() {
    return pos < tokens.length ? tokens[pos] : null;
  }

  function consume() {
    return tokens[pos++];
  }

  function parseExpression() {
    return parseAddSub();
  }

  function parseAddSub() {
    let node = parseMulDiv();
    while (peek() && (peek().value === '+' || peek().value === '-')) {
      const op = consume().value;
      const right = parseMulDiv();
      node = { type: 'binary', op: op, left: node, right: right };
    }
    return node;
  }

  function parseMulDiv() {
    let node = parsePower();
    while (peek() && (peek().value === '*' || peek().value === '/')) {
      const op = consume().value;
      const right = parsePower();
      node = { type: 'binary', op: op, left: node, right: right };
    }
    return node;
  }

  function parsePower() {
    let node = parseUnary();
    while (peek() && peek().value === '^') {
      const op = consume().value;
      const right = parseUnary();
      node = { type: 'binary', op: op, left: node, right: right };
    }
    return node;
  }

  function parseUnary() {
    if (peek() && peek().value === '-') {
      consume();
      const node = parseUnary();
      return { type: 'unary', op: '-', expr: node };
    }
    if (peek() && peek().value === '+') {
      consume();
      return parseUnary();
    }
    return parsePrimary();
  }

  function parsePrimary() {
    const token = peek();
    if (!token) throw new Error('Unexpected end of expression');

    if (token.type === 'number') {
      consume();
      return { type: 'number', value: token.value };
    }

    if (token.type === 'function') {
      const funcName = consume().value;
      const openParen = consume();
      if (openParen.value !== '(') throw new Error('Expected ( after function ' + funcName);
      const arg = parseExpression();
      const closeParen = consume();
      if (!closeParen || closeParen.value !== ')') throw new Error('Expected ) after function argument');
      return { type: 'function_call', name: funcName, arg: arg };
    }

    if (token.type === 'operator' && token.value === '(') {
      consume();
      const node = parseExpression();
      const closeParen = consume();
      if (!closeParen || closeParen.value !== ')') throw new Error('Expected ) after expression');
      return node;
    }

    throw new Error('Unexpected token: ' + JSON.stringify(token));
  }

  const ast = parseExpression();
  if (pos < tokens.length) {
    throw new Error('Unexpected extra tokens at end of expression');
  }
  return ast;
}

// Evaluator
function evaluateAST(node, stepLog = [], noIntermediate = true) {
  if (node.type === 'number') {
    const valStr = node.value;
    const val = parseFloat(valStr);
    const sfInfo = countSigFigs(valStr);
    const sf = sfInfo ? sfInfo.count : 999;
    const dp = getDecimalPlacesWithTrailing(valStr);
    return { value: val, unroundedValue: val, sf: sf, dp: dp, str: valStr };
  }

  if (node.type === 'unary') {
    const arg = evaluateAST(node.expr, stepLog, noIntermediate);
    const result = node.op === '-' ? -arg.value : arg.value;
    const unroundedResult = node.op === '-' ? -arg.unroundedValue : arg.unroundedValue;
    return { value: result, unroundedValue: unroundedResult, sf: arg.sf, dp: arg.dp, str: node.op + arg.str };
  }

  if (node.type === 'binary') {
    const left = evaluateAST(node.left, stepLog, noIntermediate);
    const right = evaluateAST(node.right, stepLog, noIntermediate);

    // We use the unrounded values for internal exact calculations if noIntermediate is true
    const lv = noIntermediate ? left.unroundedValue : left.value;
    const rv = noIntermediate ? right.unroundedValue : right.value;

    let resultValue, unroundedValue, resultSf, resultDp, resultStr, rule, limitValue, limitSource;

    if (node.op === '+' || node.op === '-') {
      unroundedValue = node.op === '+' ? lv + rv : lv - rv;
      resultDp = Math.min(left.dp, right.dp);
      limitValue = resultDp;
      limitSource = left.dp <= right.dp ? left.str : right.str;
      rule = 'add-sub';

      const strVal = formatResult(unroundedValue, null, true, resultDp);
      resultValue = parseFloat(strVal);
      // Determine sf of the result based on the formatted string
      const info = countSigFigs(strVal);
      resultSf = info ? info.count : 1;

    } else if (node.op === '*' || node.op === '/') {
      unroundedValue = node.op === '*' ? lv * rv : lv / rv;
      resultSf = Math.min(left.sf, right.sf);
      limitValue = resultSf;
      limitSource = left.sf <= right.sf ? left.str : right.str;
      rule = 'mul-div';

      const strVal = formatResult(unroundedValue, resultSf, false, null);
      resultValue = parseFloat(strVal);
      resultDp = getDecimalPlacesWithTrailing(strVal);

    } else if (node.op === '^') {
      unroundedValue = Math.pow(lv, rv);
      // Standard rule for powers: result has same sig figs as the base.
      resultSf = left.sf;
      limitValue = resultSf;
      limitSource = left.str;
      rule = 'mul-div'; // effectively same as mul/div for sf rules

      const strVal = formatResult(unroundedValue, resultSf, false, null);
      resultValue = parseFloat(strVal);
      resultDp = getDecimalPlacesWithTrailing(strVal);
    }

    const exprStr = `(${left.str} ${node.op} ${right.str})`;
    const displayValue = noIntermediate ? unroundedValue : resultValue;
    const formattedDisplay = formatResult(unroundedValue, rule==='mul-div'?resultSf:null, rule==='add-sub', resultDp);

    stepLog.push({
      type: 'binary',
      expr: exprStr,
      leftStr: left.str,
      rightStr: right.str,
      op: node.op,
      rule: rule,
      limitValue: limitValue,
      limitSource: limitSource,
      calcValue: unroundedValue,
      roundedStr: formattedDisplay,
      usedUnrounded: noIntermediate
    });

    return { value: resultValue, unroundedValue: unroundedValue, sf: resultSf, dp: resultDp, str: formattedDisplay };
  }

  if (node.type === 'function_call') {
    const arg = evaluateAST(node.arg, stepLog, noIntermediate);
    const av = noIntermediate ? arg.unroundedValue : arg.value;
    let unroundedValue, resultSf, resultDp, rule, limitValue, limitSource;

    if (node.name === 'log' || node.name === 'ln') {
      // Logarithm rule: The number of significant figures in the argument becomes
      // the number of decimal places in the mantissa of the result.
      unroundedValue = node.name === 'log' ? Math.log10(av) : Math.log(av);
      resultDp = arg.sf;
      limitValue = resultDp;
      limitSource = arg.str;
      rule = 'log';

      const strVal = formatResult(unroundedValue, null, true, resultDp);
      resultValue = parseFloat(strVal);
      const info = countSigFigs(strVal);
      resultSf = info ? info.count : 1;

    } else if (node.name === 'exp') {
      // Exponential rule: The number of decimal places in the argument becomes
      // the number of significant figures in the result.
      unroundedValue = Math.exp(av);
      resultSf = arg.dp;
      // if dp is 0, default to at least 1 sig fig to be safe, though rules can be tricky here.
      if(resultSf <= 0) resultSf = 1;
      limitValue = resultSf;
      limitSource = arg.str;
      rule = 'exp';

      const strVal = formatResult(unroundedValue, resultSf, false, null);
      resultValue = parseFloat(strVal);
      resultDp = getDecimalPlacesWithTrailing(strVal);

    } else if (node.name === 'sqrt') {
      unroundedValue = Math.sqrt(av);
      resultSf = arg.sf;
      limitValue = resultSf;
      limitSource = arg.str;
      rule = 'sqrt';

      const strVal = formatResult(unroundedValue, resultSf, false, null);
      resultValue = parseFloat(strVal);
      resultDp = getDecimalPlacesWithTrailing(strVal);
    } else if (['sin', 'cos', 'tan'].includes(node.name)) {
        // Trig functions: generally treated like multiplication/division for sig figs (same sf as input)
        // Note: assumes input is in radians for JS Math, but users usually mean degrees or radians depending on context.
        // We will default to Math functions (radians) and propagate sig figs of the argument.
        if (node.name === 'sin') unroundedValue = Math.sin(av);
        if (node.name === 'cos') unroundedValue = Math.cos(av);
        if (node.name === 'tan') unroundedValue = Math.tan(av);

        resultSf = arg.sf;
        limitValue = resultSf;
        limitSource = arg.str;
        rule = 'trig';

        const strVal = formatResult(unroundedValue, resultSf, false, null);
        resultValue = parseFloat(strVal);
        resultDp = getDecimalPlacesWithTrailing(strVal);
    }

    const formattedDisplay = formatResult(unroundedValue, (rule==='log'||rule==='add-sub')?null:resultSf, (rule==='log'||rule==='add-sub'), (rule==='log'||rule==='add-sub')?resultDp:null);

    stepLog.push({
      type: 'function',
      expr: `${node.name}(${arg.str})`,
      funcName: node.name,
      argStr: arg.str,
      rule: rule,
      limitValue: limitValue,
      limitSource: limitSource,
      calcValue: unroundedValue,
      roundedStr: formattedDisplay,
      usedUnrounded: noIntermediate
    });

    return { value: resultValue, unroundedValue: unroundedValue, sf: resultSf, dp: resultDp, str: formattedDisplay };
  }
}

// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let state = {
  mode: 'practice',       // practice | exam
  inputMode: 'basic',     // basic | adv
  op: '×',
  noIntermediate: true,
  history: [],
  notation: 'normal',
  lastResult: null,
};

// ─────────────────────────────────────────────
//  UTILITIES
// ─────────────────────────────────────────────

function countSigFigs(numStr) {
  // Returns { count, ambiguous, suggestion }
  const s = numStr.trim();
  if (!s || isNaN(+s.replace(/e.*$/i,'').replace(/\.$/,''))) return null;

  // Handle scientific notation
  if (/e/i.test(s)) {
    const mantissa = s.split(/e/i)[0].replace(/^-/, '');
    return { count: countSigFigsPlain(mantissa), ambiguous: false };
  }

  const isNeg = s.startsWith('-');
  const clean = isNeg ? s.slice(1) : s;

  // Trailing decimal point → all digits significant
  if (clean.endsWith('.')) {
    const digits = clean.slice(0,-1).replace('.','');
    return { count: digits.length, ambiguous: false };
  }

  const count = countSigFigsPlain(clean);
  const ambiguous = isAmbiguous(clean);

  let suggestion = null;
  if (ambiguous) {
    const stripped = clean.replace('.','');
    const trailingZeros = (stripped.match(/0+$/) || [''])[0].length;
    const nonZeroLen = stripped.length - trailingZeros;
    suggestion = [];
    for (let n = nonZeroLen; n <= stripped.length; n++) {
      if (n === stripped.length - trailingZeros) continue;
      suggestion.push({ count: n, expr: toSciNotation(+clean, n) });
    }
    if (!suggestion.length) suggestion = null;
  }

  return { count, ambiguous, suggestion };
}

function countSigFigsPlain(s) {
  // remove leading zeros and sign
  const clean = s.replace(/^-/, '').replace('.','');
  // leading zeros not significant
  const trimmed = clean.replace(/^0+/, '');
  if (!trimmed) return 1; // e.g. "0"
  // if has decimal in original → trailing zeros ARE significant
  const hasDot = s.includes('.');
  if (hasDot) return trimmed.length;
  // no decimal → trailing zeros ambiguous; count to last non-zero
  const noTrail = trimmed.replace(/0+$/, '');
  return noTrail.length || 1;
}

function isAmbiguous(s) {
  if (s.includes('.')) return false;
  if (/e/i.test(s)) return false;
  const clean = s.replace(/^-/,'');
  if (!clean.endsWith('0')) return false;
  const nonZero = clean.replace(/0+$/,'');
  return nonZero.length > 0;
}

function getDecimalPlaces(numStr) {
  const s = numStr.trim().replace(/e.*$/i,'');
  if (s.includes('.')) {
    return s.split('.')[1].replace(/0+$/,'').length;
  }
  return 0;
}

function getDecimalPlacesWithTrailing(numStr) {
  // Keep trailing zeros for sig fig purposes
  const s = numStr.trim();
  if (/e/i.test(s)) {
    // parse exponent
    const [mantissa, exp] = s.split(/e/i);
    const dp = (mantissa.includes('.')) ? mantissa.split('.')[1].length : 0;
    const e = parseInt(exp);
    return Math.max(0, dp - e);
  }
  if (s.includes('.')) return s.split('.')[1].length;
  return 0;
}

function toSciNotation(num, sigFigs) {
  return num.toExponential(sigFigs - 1)
    .replace('e+', ' × 10^')
    .replace('e-', ' × 10^-')
    .replace('e', ' × 10^');
}

function formatResult(num, sigFigs, isAddSub, decimalPlaces) {
  if (isAddSub) {
    // Round to decimalPlaces
    const factor = Math.pow(10, decimalPlaces);
    const rounded = Math.round(num * factor) / factor;
    return decimalPlaces > 0 ? rounded.toFixed(decimalPlaces) : rounded.toString();
  } else {
    // Round to sigFigs
    if (num === 0) return '0';
    const d = Math.floor(Math.log10(Math.abs(num)));
    const factor = Math.pow(10, sigFigs - 1 - d);
    const rounded = Math.round(num * factor) / factor;
    // Format with correct number of sig figs
    const decNeeded = sigFigs - 1 - d;
    if (decNeeded > 0) return rounded.toFixed(decNeeded);
    return rounded.toFixed(0);
  }
}

// ─────────────────────────────────────────────
//  UI MODE
// ─────────────────────────────────────────────
function setMode(m) {
  state.mode = m;
  document.getElementById('btn-practice').classList.toggle('active', m === 'practice');
  document.getElementById('btn-exam').classList.toggle('active', m === 'exam');
  document.body.classList.toggle('exam-mode', m === 'exam');

  const examBanner = document.getElementById('exam-banner');
  if (examBanner) {
    examBanner.style.display = m === 'exam' ? 'block' : 'none';
  }
}

function setInputMode(m) {
  state.inputMode = m;
  document.getElementById('btn-basic').classList.toggle('active', m === 'basic');
  document.getElementById('btn-adv').classList.toggle('active', m === 'adv');
  document.getElementById('basic-input').style.display = m === 'basic' ? '' : 'none';
  document.getElementById('adv-input').style.display = m === 'adv' ? '' : 'none';
}

function selectOp(op) {
  state.op = op;
  ['mul','div','add','sub'].forEach(k => {
    document.getElementById('op-'+k).classList.remove('selected');
  });
  const map = {'×':'mul','÷':'div','+':'add','−':'sub'};
  document.getElementById('op-'+map[op]).classList.add('selected');

  const ruleDesc = document.getElementById('rule-desc');
  if (ruleDesc) {
    if (op === '+' || op === '−') {
      ruleDesc.textContent = '덧셈/뺄셈 → 소수점 자리 기준';
      ruleDesc.style.color = 'var(--accent2)';
    } else {
      ruleDesc.textContent = '곱셈/나눗셈 → 유효숫자 기준';
      ruleDesc.style.color = 'var(--accent)';
    }
  }
}

function toggleOption(key) {
  state[key] = !state[key];
  document.getElementById('no-intermediate-toggle').classList.toggle('on', state.noIntermediate);
  const adv = document.getElementById('no-intermediate-toggle-adv');
  if (adv) adv.classList.toggle('on', state.noIntermediate);
}

// ─────────────────────────────────────────────
//  WARN ON INPUT
// ─────────────────────────────────────────────
function onValueInput(n) {
  const val = document.getElementById('v' + n).value.trim();
  checkAndWarn(val, n);
}

function onAdvInput() {
  // parse tokens and check each
  const expr = document.getElementById('adv-expr').value;
  const tokens = expr.match(/[\d.]+(?:e[+-]?\d+)?/gi) || [];
  const ambiguous = tokens.filter(t => isAmbiguous(t));
  showWarnings(ambiguous);
}

function checkAndWarn(val, slot) {
  const inp = document.getElementById('v' + slot);
  const viz = document.getElementById('v' + slot + '-viz');

  if (!val) {
    inp.className = '';
    if (viz) viz.style.display = 'none';
    return;
  }

  const info = countSigFigs(val);
  if (!info) {
    inp.classList.add('err');
    if (viz) viz.style.display = 'none';
    return;
  }

  inp.className = info.ambiguous ? 'warn' : '';

  if (viz) {
    viz.innerHTML = buildDigitViz(val, info.count);
    viz.style.display = 'block';
  }

  // collect all warnings
  const v1 = document.getElementById('v1').value.trim();
  const v2 = document.getElementById('v2').value.trim();
  const ambiguous = [v1, v2].filter(v => v && isAmbiguous(v));
  showWarnings(ambiguous);
}

function showWarnings(ambiguous) {
  const box = document.getElementById('warn-box');
  const content = document.getElementById('warn-content');
  if (!ambiguous.length) { box.classList.remove('show'); return; }

  let html = '';
  ambiguous.forEach(val => {
    const stripped = val.replace(/^0+/,'');
    const trailingZeros = (stripped.match(/0+$/) || [''])[0].length;
    const nonZeroLen = stripped.length - trailingZeros;
    let chips = '';
    for (let n = nonZeroLen; n <= stripped.length; n++) {
      chips += `<span class="suggest-chip" onclick="insertSuggestion('${val}', '${toSciNotation(+val, n)}', ${n})">${toSciNotation(+val, n)} (${n}개)</span>`;
    }
    chips += `<span class="suggest-chip" onclick="insertSuggestion('${val}', '${val}.', null)">${val}. (전체 유효)</span>`;
    html += `<div class="warning-item">⚠ <strong>${val}</strong> — 유효숫자 해석이 애매합니다.</div>
             <div class="warning-suggest">${chips}</div>`;
  });
  content.innerHTML = html;
  box.classList.add('show');
}

function insertSuggestion(original, suggested, n) {
  // replace in whichever field contains original
  ['v1','v2'].forEach(id => {
    const inp = document.getElementById(id);
    if (inp && inp.value.trim() === original) {
      inp.value = suggested;
      inp.className = '';
      checkAndWarn(suggested, id === 'v1' ? 1 : 2);
    }
  });
}

// ─────────────────────────────────────────────
//  MAIN CALCULATE
// ─────────────────────────────────────────────
function calculate() {
  hideError();
  if (state.inputMode === 'adv') { calculateAdv(); return; }

  const s1 = document.getElementById('v1').value.trim();
  const s2 = document.getElementById('v2').value.trim();
  const op = state.op;

  if (!s1 || !s2) { showError('값을 입력해주세요.'); return; }

  const n1 = parseFloat(s1.replace(/×.*$/,''));
  const n2 = parseFloat(s2.replace(/×.*$/,''));
  if (isNaN(n1) || isNaN(n2)) { showError('올바른 숫자를 입력해주세요.'); return; }
  if ((op === '÷') && n2 === 0) { showError('0으로 나눌 수 없습니다.'); return; }

  const info1 = countSigFigs(s1);
  const info2 = countSigFigs(s2);
  if (!info1 || !info2) { showError('유효숫자를 판별할 수 없는 입력입니다.'); return; }

  const isAddSub = (op === '+' || op === '−');
  let rawResult;
  if (op === '×') rawResult = n1 * n2;
  else if (op === '÷') rawResult = n1 / n2;
  else if (op === '+') rawResult = n1 + n2;
  else rawResult = n1 - n2;

  let finalStr, limitValue, limitSource, rule;
  let dp1, dp2, minDp;

  if (isAddSub) {
    dp1 = getDecimalPlacesWithTrailing(s1);
    dp2 = getDecimalPlacesWithTrailing(s2);
    minDp = Math.min(dp1, dp2);
    limitSource = dp1 <= dp2 ? s1 : s2;
    limitValue = minDp;
    finalStr = formatResult(rawResult, null, true, minDp);
    rule = 'add-sub';
  } else {
    const sf1 = info1.count, sf2 = info2.count;
    const minSf = Math.min(sf1, sf2);
    limitSource = sf1 <= sf2 ? s1 : s2;
    limitValue = minSf;
    finalStr = formatResult(rawResult, minSf, false, null);
    rule = 'mul-div';
  }

  const u1 = document.getElementById('u1').value.trim();
  const u2 = document.getElementById('u2').value.trim();

  state.lastResult = { s1, s2, op, n1, n2, rawResult, finalStr, rule, limitValue, limitSource,
    info1, info2, isAddSub, dp1, dp2, minDp, u1, u2 };

  showResult(state.lastResult);
  addHistory(state.lastResult);
}

function calculateAdv() {
  const expr = document.getElementById('adv-expr').value.trim();
  if (!expr) { showError('수식을 입력해주세요.'); return; }

  try {
    const tokens = tokenize(expr);
    const ast = parse(tokens);
    const stepLog = [];

    // Check toggle for noIntermediate
    const noIntermediate = state.noIntermediate;

    const result = evaluateAST(ast, stepLog, noIntermediate);

    if (!isFinite(result.value) || !isFinite(result.unroundedValue)) {
      showError('계산 결과가 유효하지 않습니다 (0 나누기 등).');
      return;
    }

    // We use the final node's rules (from the last step in stepLog) to define rule, limitValue, etc.
    const lastStep = stepLog.length > 0 ? stepLog[stepLog.length - 1] : null;
    let rule = lastStep ? lastStep.rule : 'none';
    let limitValue = lastStep ? lastStep.limitValue : result.sf;
    let limitSource = lastStep ? lastStep.limitSource : result.str;

    const simpleResult = {
      expr,
      tokens,
      rawResult: result.unroundedValue,
      finalStr: result.str,
      rule,
      limitValue,
      limitSource,
      isAddSub: rule === 'add-sub',
      advMode: true,
      stepLog: stepLog
    };

    state.lastResult = simpleResult;
    showResultAdv(simpleResult);
    addHistory(simpleResult);

  } catch (e) {
    showError('수식 오류: ' + e.message);
  }
}

    badge.className = 'result-badge add-sub';
  } else {
    badge.textContent = '유효숫자 개수 기준';
    badge.className = 'result-badge';
  }

  // Build step table
  let rows = '';
  const opSymbol = r.op;

  if (r.rule === 'add-sub') {
    rows += makeRow('값 1', `<span class="highlight-green">${r.s1}</span>${r.u1 ? ' ' + r.u1 : ''} → 소수점 ${r.dp1}자리`);
    rows += makeRow('값 2', `<span class="highlight-green">${r.s2}</span>${r.u2 ? ' ' + r.u2 : ''} → 소수점 ${r.dp2}자리`);
    rows += makeRow('연산', opSymbol === '+' ? '덧셈' : '뺄셈');
    rows += makeRow('규칙', '덧셈/뺄셈 → <span class="highlight-yellow">소수점 이하 자리수</span> 기준');
    rows += makeRow('제한 기준', `<span class="highlight-red">${r.limitSource}</span> → ${r.limitValue}자리`);
    rows += makeRow('계산값', r.rawResult.toPrecision(10).replace(/\.?0+$/, ''));
    rows += makeRow('반올림 위치', `소수점 ${r.limitValue}번째 자리`);
    rows += makeRow('최종 결과', `<span class="highlight-green" style="font-size:1.05rem">${r.finalStr}${r.u1 ? ' ' + r.u1 : ''}</span>`);
  } else {
    rows += makeRow('값 1', `<span class="highlight-green">${r.s1}</span>${r.u1 ? ' ' + r.u1 : ''} → 유효숫자 <span class="highlight-yellow">${r.info1.count}개</span>`);
    rows += makeRow('값 2', `<span class="highlight-green">${r.s2}</span>${r.u2 ? ' ' + r.u2 : ''} → 유효숫자 <span class="highlight-yellow">${r.info2.count}개</span>`);
    rows += makeRow('연산', opSymbol === '×' ? '곱셈' : '나눗셈');
    rows += makeRow('규칙', '곱셈/나눗셈 → <span class="highlight-yellow">유효숫자 개수</span> 기준');
    rows += makeRow('제한 기준', `<span class="highlight-red">${r.limitSource}</span> (${r.limitValue}개)`);
    rows += makeRow('계산값', r.rawResult.toPrecision(10).replace(/\.?0+$/, ''));
    rows += makeRow('최종 결과', `<span class="highlight-green" style="font-size:1.05rem">${r.finalStr}${r.u1 ? ' ' + r.u1 : ''}</span>`);
  }

  document.getElementById('step-table').innerHTML = rows;
  state.notation = 'normal';
  updateNotationChips();
  document.getElementById('sci-both-display').style.display = 'none';

  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function showResultAdv(r) {
  const card = document.getElementById('result-card');
  card.classList.add('show');

  document.getElementById('res-final').textContent = r.finalStr;
  document.getElementById('res-unit-display').textContent = '';

  const badge = document.getElementById('rule-badge');

  // Set badge based on final operation
  if (r.rule === 'add-sub') {
    badge.textContent = '소수점 자리수 기준 (마지막 연산)';
    badge.className = 'result-badge add-sub';
  } else {
    badge.textContent = '유효숫자 개수 기준 (마지막 연산)';
    badge.className = 'result-badge';
  }

  let rows = '';
  rows += makeRow('입력 식', `<code style="font-size: 1.05rem; font-weight: 600;">${r.expr}</code>`);

  if (r.stepLog && r.stepLog.length > 0) {
    let stepNumber = 1;
    r.stepLog.forEach(step => {
      let stepHtml = '';
      if (step.type === 'binary') {
        const ruleText = step.rule === 'add-sub' ? '소수점 자리' : '유효숫자';
        const limitUnit = step.rule === 'add-sub' ? '자리' : '개';

        stepHtml = `<div style="margin-bottom: 4px;"><strong>계산:</strong> <code>${step.expr}</code> = ${step.calcValue.toPrecision(10).replace(/\.?0+$/,'')}</div>`;
        stepHtml += `<div style="font-size: 0.75rem; color: var(--muted); margin-bottom: 4px;"><strong>규칙:</strong> ${ruleText} 기준 &rarr; <span class="highlight-red">${step.limitSource}</span> (${step.limitValue}${limitUnit})</div>`;

        if (step.usedUnrounded && stepNumber < r.stepLog.length) {
            stepHtml += `<div><strong>결과:</strong> <span class="highlight-green">${step.roundedStr}</span> <span style="font-size: 0.75rem; color: var(--accent2);">(다음 계산 시 정밀값 유지)</span></div>`;
        } else {
            stepHtml += `<div><strong>결과:</strong> <span class="highlight-green">${step.roundedStr}</span></div>`;
        }
      } else if (step.type === 'function') {
        const ruleText = step.rule === 'log' ? '소수점 자리 (인수의 유효숫자 개수)' :
                         step.rule === 'exp' ? '유효숫자 (인수의 소수점 자리수)' :
                         '유효숫자 (인수와 동일)';
        const limitUnit = step.rule === 'log' ? '자리' : '개';

        stepHtml = `<div style="margin-bottom: 4px;"><strong>계산:</strong> <code>${step.expr}</code> = ${step.calcValue.toPrecision(10).replace(/\.?0+$/,'')}</div>`;
        stepHtml += `<div style="font-size: 0.75rem; color: var(--muted); margin-bottom: 4px;"><strong>규칙:</strong> ${ruleText} &rarr; <span class="highlight-red">${step.limitSource}</span> (${step.limitValue}${limitUnit})</div>`;

        if (step.usedUnrounded && stepNumber < r.stepLog.length) {
            stepHtml += `<div><strong>결과:</strong> <span class="highlight-green">${step.roundedStr}</span> <span style="font-size: 0.75rem; color: var(--accent2);">(다음 계산 시 정밀값 유지)</span></div>`;
        } else {
            stepHtml += `<div><strong>결과:</strong> <span class="highlight-green">${step.roundedStr}</span></div>`;
        }
      }
      rows += makeRow(`<span style="color:var(--muted)">단계 ${stepNumber}</span>`, stepHtml);
      stepNumber++;
    });
  }

  rows += makeRow('<span style="color:var(--accent)">최종 결과</span>', `<span class="highlight-green" style="font-size:1.1rem; font-weight: 700;">${r.finalStr}</span>`);

  document.getElementById('step-table').innerHTML = rows;
  state.notation = 'normal';
  updateNotationChips();
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function makeRow(label, value) {
  return `<tr><td>${label}</td><td>${value}</td></tr>`;
}

// ─────────────────────────────────────────────
//  NOTATION SWITCH
// ─────────────────────────────────────────────
function switchNotation(type) {
  state.notation = type;
  updateNotationChips();
  if (!state.lastResult) return;
  const r = state.lastResult;
  const num = parseFloat(r.finalStr);

  if (type === 'normal') {
    document.getElementById('res-final').textContent = r.finalStr;
    document.getElementById('sci-both-display').style.display = 'none';
  } else if (type === 'sci') {
    const sf = r.limitValue;
    document.getElementById('res-final').textContent = toSciNotation(num, sf);
    document.getElementById('sci-both-display').style.display = 'none';
  } else {
    const sf = r.limitValue;
    document.getElementById('res-final').textContent = r.finalStr;
    const sciDisp = document.getElementById('sci-both-display');
    sciDisp.style.display = 'block';
    sciDisp.innerHTML = `= <span style="color:var(--accent)">${toSciNotation(num, sf)}</span>`;
  }
}

function updateNotationChips() {
  ['normal','sci','both'].forEach(t => {
    document.getElementById('chip-'+t).classList.toggle('active', state.notation === t);
  });
}

// ─────────────────────────────────────────────
//  SIGFIG ANALYZER
// ─────────────────────────────────────────────
function analyzeOne() {
  const val = document.getElementById('ana-input').value.trim();
  const res = document.getElementById('ana-result');
  if (!val) { res.classList.remove('show'); return; }

  const info = countSigFigs(val);
  if (!info) {
    res.innerHTML = '<span style="color:var(--accent3)">인식할 수 없는 숫자입니다.</span>';
    res.classList.add('show');
    return;
  }

  // Build digit highlight
  let digitHtml = buildDigitViz(val, info.count);

  let html = `<div style="color:var(--muted); font-size:.72rem; margin-bottom:6px; letter-spacing:.06em;">유효숫자 개수</div>`;
  html += `<div style="font-size:1.4rem; font-weight:600; color:var(--accent); margin-bottom:10px;">${info.count}개</div>`;
  html += digitHtml;

  if (info.ambiguous) {
    html += `<div style="margin-top:12px; font-size:.78rem; color:var(--accent2);">⚠ 해석이 애매한 숫자 — 과학적 표기 권장:</div>`;
    const stripped = val.replace(/^0*/,'');
    const trailingZeros = (stripped.match(/0+$/) || [''])[0].length;
    const nonZeroLen = stripped.length - trailingZeros;
    html += '<div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">';
    for (let n = nonZeroLen; n <= stripped.length; n++) {
      html += `<span style="background:var(--panel);border:1px solid rgba(240,200,74,.3);border-radius:6px;padding:4px 10px;font-size:.78rem;color:var(--accent2);">${toSciNotation(+val,n)} → ${n}개</span>`;
    }
    html += `<span style="background:var(--panel);border:1px solid rgba(240,200,74,.3);border-radius:6px;padding:4px 10px;font-size:.78rem;color:var(--accent2);">${val}. → 전체 유효</span>`;
    html += '</div>';
  }

  res.innerHTML = html;
  res.classList.add('show');
}

function buildDigitViz(val, sigCount) {
  // Show each character with sig/non-sig coloring
  const s = val.trim();
  let html = '<div class="sig-display">';
  
  // Parse: leading zeros non-sig, then count sigCount sig, rest non-sig
  let inSig = false, sigSeen = 0;
  let isLeading = true;
  const hasDot = s.includes('.');
  
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (ch === '-') { html += `<span class="sig-digit dot">−</span>`; continue; }
    if (ch === '.') { html += `<span class="sig-digit dot">.</span>`; isLeading = false; continue; }
    if (ch.toLowerCase() === 'e') break;
    
    // Is this char significant?
    if (isLeading && ch === '0') {
      html += `<span class="sig-digit non-sig">0</span>`;
    } else {
      isLeading = false;
      if (sigSeen < sigCount) {
        html += `<span class="sig-digit sig">${ch}</span>`;
        sigSeen++;
      } else {
        html += `<span class="sig-digit non-sig">${ch}</span>`;
      }
    }
  }
  html += '</div>';
  html += `<div class="practice-only" style="font-size:.7rem;color:var(--muted);margin-top:6px;">
    <span style="display:inline-block;width:10px;height:10px;background:rgba(74,240,200,.18);border:1px solid rgba(74,240,200,.3);border-radius:3px;vertical-align:middle;margin-right:3px;"></span>유효숫자 &nbsp;
    <span style="display:inline-block;width:10px;height:10px;background:var(--panel);border:1px solid var(--border);border-radius:3px;vertical-align:middle;margin-right:3px;"></span>비유효
  </div>`;
  return html;
}

// ─────────────────────────────────────────────
//  HISTORY
// ─────────────────────────────────────────────
function addHistory(r) {
  let label, result;
  if (r.advMode) {
    label = r.expr;
    result = r.finalStr;
  } else {
    label = `${r.s1} ${r.op} ${r.s2}`;
    result = r.finalStr + (r.u1 ? ' ' + r.u1 : '');
  }
  state.history.unshift({ label, result, data: r });
  if (state.history.length > 10) state.history.pop();
  renderHistory();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (!state.history.length) {
    list.innerHTML = '<div class="history-empty">계산 기록이 없습니다</div>';
    return;
  }
  list.innerHTML = state.history.map((h, i) => `
    <div class="history-item" onclick="recallHistory(${i})">
      <div class="history-expr">${h.label}</div>
      <div class="history-result">= ${h.result}</div>
    </div>
  `).join('');
}

function recallHistory(i) {
  const h = state.history[i];
  state.lastResult = h.data;
  if (h.data.advMode) {
    setInputMode('adv');
    document.getElementById('adv-expr').value = h.data.expr;
    showResultAdv(h.data);
  } else {
    setInputMode('basic');
    document.getElementById('v1').value = h.data.s1;
    document.getElementById('v2').value = h.data.s2;
    document.getElementById('u1').value = h.data.u1 || '';
    document.getElementById('u2').value = h.data.u2 || '';
    selectOp(h.data.op);
    showResult(h.data);
  }
}

function clearHistory() {
  state.history = [];
  renderHistory();
}

// ─────────────────────────────────────────────
//  COPY
// ─────────────────────────────────────────────
function copyResult() {
  if (!state.lastResult) return;
  const r = state.lastResult;
  const text = r.finalStr + (r.u1 ? ' ' + r.u1 : '');
  navigator.clipboard.writeText(text).then(() => {
    showToast('복사 완료: ' + text);
  });
}

function copyFull() {
  if (!state.lastResult) return;
  const r = state.lastResult;
  let text = '';
  if (r.advMode) {
    text = `식: ${r.expr}\n적용 규칙: ${r.rule === 'add-sub' ? '소수점 자리수 기준' : '유효숫자 개수 기준'}\n제한 기준: ${r.limitSource} (${r.limitValue}${r.rule === 'add-sub' ? '자리' : '개'})\n계산값: ${r.rawResult}\n최종 결과: ${r.finalStr}`;
  } else {
    if (r.rule === 'add-sub') {
      text = `값1: ${r.s1} → 소수점 ${r.dp1}자리\n값2: ${r.s2} → 소수점 ${r.dp2}자리\n연산: ${r.op === '+' ? '덧셈' : '뺄셈'}\n규칙: 덧셈/뺄셈은 소수점 이하 자리수 기준\n제한 기준: ${r.limitSource} (${r.limitValue}자리)\n계산값: ${r.rawResult}\n최종 결과: ${r.finalStr}${r.u1 ? ' ' + r.u1 : ''}`;
    } else {
      text = `값1: ${r.s1}${r.u1 ? ' ' + r.u1 : ''} → 유효숫자 ${r.info1.count}개\n값2: ${r.s2}${r.u2 ? ' ' + r.u2 : ''} → 유효숫자 ${r.info2.count}개\n연산: ${r.op === '×' ? '곱셈' : '나눗셈'}\n규칙: 곱셈/나눗셈은 유효숫자 개수 기준\n제한 기준: ${r.limitSource} (${r.limitValue}개)\n계산값: ${r.rawResult}\n최종 결과: ${r.finalStr}${r.u1 ? ' ' + r.u1 : ''}`;
    }
  }
  navigator.clipboard.writeText(text).then(() => showToast('전체 과정 복사 완료'));
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e2230;border:1px solid #2a2f3e;color:#4af0c8;padding:10px 20px;border-radius:8px;font-family:monospace;font-size:.85rem;z-index:999;transition:opacity .3s;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.opacity = '0', 2000);
}

// ─────────────────────────────────────────────
//  MISC
// ─────────────────────────────────────────────
function resetAll() {
  document.getElementById('v1').value = '';
  document.getElementById('v2').value = '';
  document.getElementById('u1').value = '';
  document.getElementById('u2').value = '';
  document.getElementById('adv-expr').value = '';
  document.getElementById('result-card').classList.remove('show');
  document.getElementById('warn-box').classList.remove('show');
  document.getElementById('ana-result').classList.remove('show');
  document.getElementById('ana-input').value = '';

  const v1Viz = document.getElementById('v1-viz');
  const v2Viz = document.getElementById('v2-viz');
  if (v1Viz) v1Viz.style.display = 'none';
  if (v2Viz) v2Viz.style.display = 'none';

  hideError();
  state.lastResult = null;
  ['v1','v2'].forEach(id => document.getElementById(id).className = '');
}

function hideError() {
  document.getElementById('err-msg').classList.remove('show');
}

function showError(msg) {
  const el = document.getElementById('err-msg');
  el.textContent = '⚠ ' + msg;
  el.classList.add('show');
}

function toggleSteps() {
  const t = document.getElementById('step-table');
  const btn = document.getElementById('step-toggle-btn');
  if (t.style.display === 'none') {
    t.style.display = '';
    btn.textContent = '▲ 접기';
  } else {
    t.style.display = 'none';
    btn.textContent = '▼ 상세 보기';
  }
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const active = document.activeElement;
    if (active && ['v1','v2','u1','u2'].includes(active.id)) calculate();
  }
});

renderHistory();
